name: Upload

on:
  workflow_run:
    workflows: [Rust]
    types:
      - completed

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  upload:
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success'

    env:
      PAPERAGE_PASSPHRASE: supersecret

    steps:
    - uses: actions/checkout@v7
    - name: 'Download artifact'
      uses: actions/github-script@v9
      with:
        script: |
          var artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{github.event.workflow_run.id }},
              name: "visual-snapshots"
          });
          var matchArtifact = artifacts.data.artifacts[0];
          var download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
          });
          var fs = require('fs');
          fs.writeFileSync('${{github.workspace}}/visual-snapshots.zip', Buffer.from(download.data));
    - name: Create directory
      run: mkdir -p visual-snapshots
    - name: Unzip artifact
      run: unzip visual-snapshots.zip -d ./visual-snapshots
    - name: Display structure of downloaded files
      run: ls -R visual-snapshots/
    - name: Set variables
      run: |
        PR_NUMBER=$(cat ./visual-snapshots/PR.txt)
        # PR.txt comes from the triggering run, so only accept a plain number
        if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
        fi
    - name: Generate snapshots comment
      run: ./bin/snapshots-comment visual-snapshots
    - name: Comment on the PR with the snapshots
      if: ${{ env.PR_NUMBER != '' }}
      env:
        # Attachments can't be uploaded with GITHUB_TOKEN, only with a user token
        GH_TOKEN: ${{ secrets.SNAPSHOTS_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        attachments=()
        for f in visual-snapshots/*.png; do
          attachments+=(--attach "$f")
        done
        comment_url=$(gh pr comment "$PR_NUMBER" \
          --body-file visual-snapshots.tmp \
          "${attachments[@]}")
        echo "Posted $comment_url"
        new_id="${comment_url##*-}"

        # Remove the previous snapshot comments posted by the same account
        login=$(gh api user --jq .login)
        gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.user.login == \"$login\" and .id != $new_id and (.body | contains(\"<!-- paper-age-visual-snapshots -->\"))) | .id" |
          while read -r id; do
            echo "Deleting previous snapshots comment $id"
            gh api -X DELETE "repos/$GH_REPO/issues/comments/$id"
          done
